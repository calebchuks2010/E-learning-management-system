<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Cclass</title>
    <link rel="stylesheet" href="../login/style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">Cclass</div>
            <h1>Teacher Login</h1>
            <p class="subtitle">Login to continue to your teaching dashboard.</p>

            <form id="teacherLoginForm">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>

            <p class="signup-text">
                Don't have a teacher account?
                <a href="./signup.html">Create Account</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById("teacherLoginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const teachers = JSON.parse(localStorage.getItem("teachers") || "[]");
            const teacher = teachers.find(function(account) {
                return account.username.toLowerCase() === username.toLowerCase() && account.password === password;
            });

            if (!teacher) {
                alert("Incorrect teacher username or password");
                return;
            }

            localStorage.setItem("teacherLoggedIn", "true");
            localStorage.setItem("teacherUsername", teacher.username);
            const dashboardTab = window.open("./index.html", "_blank");

            if (dashboardTab) {
                dashboardTab.opener = null;
            } else {
                window.location.href = "./index.html";
            }
        });
    </script>

</body>
</html>
