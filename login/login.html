<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Cclass</title>
    <link rel="icon" href="../ChatGPT Image Sep 24, 2026, 08_27_45 AM.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../password-visibility.css">
    <script src="../password-visibility.js" defer></script>
</head>
<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                Cclass
            </div>

            <h1>Welcome Back</h1>
            <p class="subtitle">Login to continue learning.</p>

            <form id="loginForm">

                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>

                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="submit" href="../student dasboard/index.html">Login</button>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="../signup/signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            let students = JSON.parse(localStorage.getItem("students")) || [];
            let savedUsername = localStorage.getItem("username");
            let savedPassword = localStorage.getItem("password");
            let studentExists = students.some(function(student) {
                return student.username === username && student.password === password;
            });

            if (studentExists || (username === savedUsername && password === savedPassword)) {

                localStorage.setItem("loggedIn", "true");
                localStorage.setItem("username", username);

                const dashboardUrl = "../student%20dasboard/index.html";
                const dashboardTab = window.open(dashboardUrl, "_blank");

                if (dashboardTab) {
                    dashboardTab.opener = null;
                } else {
                    window.location.href = dashboardUrl;
                }

            } else {
                alert("Incorrect username or password");
            }
        });
    </script>

</body>
</html>
